<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send SMS</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f4f6; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    form { background: #fff; padding: 2rem; border-radius: 12px; width: min(420px, 90vw); box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin: 1rem 0 .3rem; font-weight: 600; font-size: .9rem; }
    input, textarea { width: 100%; box-sizing: border-box; padding: .6rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    textarea { min-height: 110px; resize: vertical; }
    button { margin-top: 1.2rem; width: 100%; padding: .7rem; border: 0; border-radius: 6px; background: #f22f46; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #result { margin-top: 1rem; font-size: .9rem; }
    .ok { color: #1a7f37; } .err { color: #c62828; }
  </style>
</head>
<body>
  <form id="form">
    <h1>Send an SMS</h1>
    <label for="to">Phone number</label>
    <input id="to" type="tel" placeholder="+15558675310" required>
    <label for="body">Message</label>
    <textarea id="body" required></textarea>
    <button id="send">Send</button>
    <div id="result"></div>
  </form>
  <script>
    const form = document.getElementById("form"), result = document.getElementById("result"), btn = document.getElementById("send");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true; result.className = ""; result.textContent = "Sending…";
      try {
        const res = await fetch("/api/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ to: to.value.trim(), body: body.value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error + (data.code ? ` (Twilio error ${data.code})` : ""));
        result.className = "ok"; result.textContent = `Sent! SID ${data.sid} (${data.status})`;
        body.value = "";
      } catch (err) {
        result.className = "err"; result.textContent = err.message;
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
